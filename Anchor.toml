[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
dice_rolling = "LTwGJmVKw2FkgByX2JehTkS2AqddnniuA2jyV4zZzwv"
dnd_sol = "5XQUKVykhN5D3WkJ1MdsRxaJDmEszjRzhje3e6TjF4Wd"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
e2e-test = "cargo test-sbf --manifest-path ./Cargo.toml -- -- --nocapture"
test = "cargo test-sbf --manifest-path ./programs/dnd_sol/Cargo.toml -- -- --nocapture"
ts-test = "bunx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 30000

[test.validator]
url = "https://api.devnet.solana.com"
bind_address = "127.0.0.1"
rpc_port = 8899
ledger = ".anchor/test-ledger"

