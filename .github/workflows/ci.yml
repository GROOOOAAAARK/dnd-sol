name: CI

on:
  push:
    branches:
      - trunk
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  programs:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    container:
      image: rust:1.99.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          curl -sSfL https://release.anza.xyz/v4.1.2/install -o /tmp/solana-install
          sh /tmp/solana-install v4.1.2 --no-modify-path
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          curl -sSLo /usr/local/bin/anchor https://github.com/otter-sec/anchor/releases/download/v1.2.1/anchor-1.2.1-x86_64-unknown-linux-gnu
          chmod +x /usr/local/bin/anchor
          anchor --version

      - name: Cache Anchor build artifacts
        uses: actions/cache@v4
        with:
          path: |
            target
            /usr/local/cargo/registry
            /usr/local/cargo/git
            ~/.cache/solana
          key: anchor-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'programs/**/*.rs', 'programs/**/Cargo.toml') }}
          restore-keys: |
            anchor-${{ runner.os }}-

      - name: Set up Solana wallet
        run: solana-keygen new --no-bip39-passphrase --force --silent

      - name: Build Anchor programs
        run: anchor build -- --features localnet-mock

      - name: Run Anchor tests
        run: anchor test --skip-build -- --features localnet-mock

  webapp:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.4-debian
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build toolchain
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends \
            python3 make g++ libusb-1.0-0-dev libudev-dev pkg-config

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare IDL artifacts for Next.js build
        run: |
          mkdir -p target/idl
          cp target/idl/* src/idl/

      - name: Build app
        env:
          NEXT_PUBLIC_APP_ENV: dev
          NEXT_PUBLIC_SOLANA_CLUSTER: localnet
          NEXT_PUBLIC_DND_PROGRAM_ADDRESS: 5XQUKVykhN5D3WkJ1MdsRxaJDmEszjRzhje3e6TjF4Wd
          NEXT_PUBLIC_DICE_ROLLING_PROGRAM_ADDRESS: LTwGJmVKw2FkgByX2JehTkS2AqddnniuA2jyV4zZzwv
        run: bun run build
