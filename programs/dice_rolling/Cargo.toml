[package]
name = "dice_rolling"
version = "0.1.0"
description = "Dice rolling features for DnD Sol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dice_rolling"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = ["anchor-lang/anchor-debug"]
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.31.0"
switchboard-on-demand = "0.3.5"

[dev-dependencies]
solana-program-test = "3.0.2"
tokio = { version = "1.41.1", features = ["full"] }
