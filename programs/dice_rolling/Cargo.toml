[package]
name = "dice_rolling"
version = "0.1.0"
description = "Dice rolling features for DnD Sol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dice_rolling"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = ["anchor-lang/anchor-debug"]
custom-heap = []
custom-panic = []
localnet-mock = []

[dependencies]
anchor-lang = "1.2.1"
switchboard-on-demand = { version = "0.13.0", default-features = false, features = ["cpi", "solana-v3"] }
solana-keccak-hasher = "3.1.0"

[target.'cfg(target_os = "solana")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
solana-program-test = "3.0.2"
tokio = { version = "1.41.1", features = ["full"] }
