[package]
name = "dnd_sol"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dnd_sol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = ["anchor-lang/anchor-debug"]
custom-heap = []
custom-panic = []
localnet-mock = ["dice_rolling/localnet-mock"]

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
dice_rolling = {path = "../dice_rolling", features = ["cpi"]}
mpl-core = "0.12.1"
solana-keccak-hasher = "3.1.0"
solana-secp256k1-recover = "3.3.0"

[target.'cfg(target_os = "solana")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
litesvm = "0.7.1"
solana-program-test = "3.0.2"
