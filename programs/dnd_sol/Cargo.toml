[package]
name = "dnd_sol"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dnd_sol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = ["anchor-lang/anchor-debug"]
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.31.0"
dice_rolling = {path = "../dice_rolling", features = ["no-entrypoint"]}

[dev-dependencies]
litesvm = "0.7.1"
solana-program-test = "3.0.2"
